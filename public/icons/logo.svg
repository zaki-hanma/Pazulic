<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 300 300" role="img" aria-label="Pazulic Logo: dunkles Torii-Tor vor rotem Halbmond im Nebel">
    <defs>
      <clipPath id="frame"><rect width="300" height="300" rx="66"></rect></clipPath>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#07080F"></stop><stop offset=".45" stop-color="#1C1222"></stop><stop offset=".8" stop-color="#3B1E28"></stop><stop offset="1" stop-color="#5A3438"></stop></linearGradient>
      <radialGradient id="moonfill" cx="30%" cy="35%" r="75%"><stop offset="0" stop-color="#FF9A72"></stop><stop offset=".45" stop-color="#F0402E"></stop><stop offset=".85" stop-color="#9A1420"></stop><stop offset="1" stop-color="#5E0A14"></stop></radialGradient>
      <radialGradient id="bigglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#FF3A2A" stop-opacity=".55"></stop><stop offset=".5" stop-color="#C21A2A" stop-opacity=".25"></stop><stop offset="1" stop-color="#C21A2A" stop-opacity="0"></stop></radialGradient>
      <linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0C0607"></stop><stop offset=".55" stop-color="#1E0C0E"></stop><stop offset="1" stop-color="#3A1216"></stop></linearGradient>
      <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FF5A3A"></stop><stop offset="1" stop-color="#FF5A3A" stop-opacity="0"></stop></linearGradient>
      <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF0A0"></stop><stop offset=".5" stop-color="#FFD24A"></stop><stop offset="1" stop-color="#C98A1C"></stop></linearGradient>
      <mask id="cres"><rect width="300" height="300" fill="#fff"></rect><circle cx="186" cy="88" r="70" fill="#000"></circle></mask>

      <filter id="cloudTex" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".012 .03" numOctaves="5" seed="7" result="n"></feTurbulence>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 .42  0 0 0 0 .32  0 0 0 0 .38  0 0 0 2.4 -1.25" result="c"></feColorMatrix>
        <feGaussianBlur in="c" stdDeviation="1.2"></feGaussianBlur>
      </filter>
      <filter id="fogTex" x="-10%" y="0" width="120%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".01 .045" numOctaves="4" seed="3" result="n"></feTurbulence>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 .85  0 0 0 0 .82  0 0 0 0 .86  0 0 0 2.2 -.9" result="c"></feColorMatrix>
        <feGaussianBlur in="c" stdDeviation="2.4"></feGaussianBlur>
      </filter>
      <filter id="moonTex" x="0" y="0" width="100%" height="100%">
        <feTurbulence type="fractalNoise" baseFrequency=".09" numOctaves="4" seed="11" result="n"></feTurbulence>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 .35  0 0 0 0 .02  0 0 0 0 .05  0 0 0 1.8 -.75"></feColorMatrix>
      </filter>
      <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8"></feGaussianBlur></filter>
      <filter id="txtglow" x="-30%" y="-80%" width="160%" height="260%"><feGaussianBlur stdDeviation="2" result="b"></feGaussianBlur><feMerge><feMergeNode in="b"></feMergeNode><feMergeNode in="b"></feMergeNode><feMergeNode in="SourceGraphic"></feMergeNode></feMerge></filter>
      <linearGradient id="fogfade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"></stop><stop offset=".35" stop-color="#fff" stop-opacity=".9"></stop><stop offset="1" stop-color="#fff"></stop></linearGradient>
      <mask id="fogmask"><rect y="170" width="300" height="130" fill="url(#fogfade)"></rect></mask>
    </defs>

    <g clip-path="url(#frame)">
      <rect width="300" height="300" fill="url(#sky)"></rect>
      <g class="cl"><rect x="-30" y="0" width="360" height="300" filter="url(#cloudTex)" opacity=".9"></rect></g>

      <circle class="glow" cx="150" cy="112" r="140" fill="url(#bigglow)"></circle>
      <g mask="url(#cres)">
        <circle cx="150" cy="112" r="88" fill="#FF4A30" opacity=".35" filter="url(#soft)"></circle>
        <circle cx="150" cy="112" r="80" fill="url(#moonfill)"></circle>
        <circle cx="150" cy="112" r="80" filter="url(#moonTex)" opacity=".8"></circle>
        <circle cx="150" cy="112" r="80" fill="none" stroke="#FFB08A" stroke-width="1.2" opacity=".6"></circle>
      </g>
      <g class="cl" opacity=".55"><rect x="-30" y="120" width="360" height="60" filter="url(#cloudTex)"></rect></g>

      <g>
        <path d="M30 116 Q60 124 150 120 Q240 124 270 116 L276 104 Q240 116 150 110 Q60 116 24 104 Z" fill="url(#wood)"></path>
        <path d="M24 104 Q60 116 150 110 Q240 116 276 104" fill="none" stroke="url(#rim)" stroke-width="1.6" opacity=".9"></path>
        <path d="M44 124 Q150 130 256 124 L252 138 Q150 142 48 138 Z" fill="url(#wood)"></path>
        <path d="M44 124 Q150 130 256 124" fill="none" stroke="#FF5A3A" stroke-width="1" opacity=".55"></path>
        <rect x="64" y="166" width="172" height="11" rx="1.5" fill="url(#wood)"></rect>
        <path d="M64 166 H236" stroke="#FF5A3A" stroke-width="1" opacity=".5"></path>
        <rect x="140" y="138" width="20" height="28" fill="#0C0607"></rect>
        <rect x="84" y="136" width="21" height="170" rx="2" fill="url(#wood)"></rect>
        <rect x="195" y="136" width="21" height="170" rx="2" fill="url(#wood)"></rect>
        <path d="M105 136 V300 M216 136 V300" stroke="#FF5A3A" stroke-width="1.4" opacity=".55"></path>
        <rect x="78" y="226" width="33" height="80" rx="2" fill="#080405"></rect>
        <rect x="189" y="226" width="33" height="80" rx="2" fill="#080405"></rect>
      </g>
      <g class="plq">
        <rect x="108" y="128" width="84" height="21" rx="2" fill="#120708" stroke="url(#gold)" stroke-width="1.4"></rect>
        <text x="150" y="143" text-anchor="middle" font-family="Shippori Mincho, serif" font-size="12.5" font-weight="800" letter-spacing="2.4" fill="url(#gold)" filter="url(#txtglow)">PAZULIC</text>
      </g>

      <g mask="url(#fogmask)">
        <g class="f1"><rect x="-60" y="170" width="420" height="140" filter="url(#fogTex)"></rect></g>
        <g class="f2" opacity=".85"><rect x="-60" y="200" width="420" height="110" filter="url(#fogTex)"></rect></g>
      </g>

      <circle class="em" cx="120" cy="250" r="1.4" fill="#FFB08A"></circle>
      <circle class="em" style="animation-delay:1.7s" cx="176" cy="260" r="1.2" fill="#FFB08A"></circle>
      <circle class="em" style="animation-delay:3.1s" cx="150" cy="240" r="1" fill="#FFD24A"></circle>

      <g class="swL" fill="#05070A">
        <path d="M0 0 H92 C80 6 70 10 58 10 C66 18 60 28 46 28 C52 38 42 46 30 44 C32 56 20 62 8 60 C10 70 4 76 0 78 Z"></path>
        <ellipse cx="62" cy="18" rx="9" ry="4" transform="rotate(-30 62 18)"></ellipse><ellipse cx="44" cy="36" rx="8" ry="3.5" transform="rotate(20 44 36)"></ellipse><ellipse cx="26" cy="52" rx="8" ry="3.5" transform="rotate(-40 26 52)"></ellipse><ellipse cx="80" cy="12" rx="8" ry="3" transform="rotate(15 80 12)"></ellipse><ellipse cx="12" cy="70" rx="7" ry="3" transform="rotate(30 12 70)"></ellipse><ellipse cx="36" cy="22" rx="7" ry="3" transform="rotate(50 36 22)"></ellipse>
      </g>
      <g class="swR" fill="#05070A">
        <path d="M300 0 H214 C226 8 236 10 248 10 C240 20 248 30 262 28 C256 40 268 46 280 42 C278 54 290 60 300 58 Z"></path>
        <ellipse cx="240" cy="16" rx="9" ry="4" transform="rotate(30 240 16)"></ellipse><ellipse cx="262" cy="34" rx="8" ry="3.5" transform="rotate(-20 262 34)"></ellipse><ellipse cx="282" cy="50" rx="8" ry="3.5" transform="rotate(40 282 50)"></ellipse><ellipse cx="224" cy="8" rx="7" ry="3" transform="rotate(-15 224 8)"></ellipse><ellipse cx="292" cy="66" rx="7" ry="3" transform="rotate(-30 292 66)"></ellipse>
      </g>
      <path class="pt" d="M250 30 c5 -6 12 -5 12 1 c-6 0 -8 5 -12 -1 Z" fill="#FFB3D1"></path>
      <path class="pt" style="animation-delay:2.4s" d="M60 26 c5 -6 12 -5 12 1 c-6 0 -8 5 -12 -1 Z" fill="#FFC6DD"></path>
      <path class="pt" style="animation-delay:4.6s" d="M200 10 c4 -5 10 -4 10 1 c-5 0 -7 4 -10 -1 Z" fill="#FFB3D1"></path>
    </g>
  </svg>